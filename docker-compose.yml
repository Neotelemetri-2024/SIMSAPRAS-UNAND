version: "3"
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: simsapras
        container_name: simsapras-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./storage:/var/www/storage
            - ./.env:/var/www/.env
        networks:
            - simsapras-network

    webserver:
        image: nginx:alpine
        container_name: simsapras-webserver
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        networks:
            - simsapras-network

networks:
    simsapras-network:
        driver: bridge
